  <!-- Connecting Spherical Ribs / Inter-star links -->
  <g fill="none" stroke="#c5d8ff" stroke-width="2.5" opacity="0.35">
    <path d="M 256,96 L 256,246 M 392,168 L 256,246 M 370,356 L 256,246 M 256,420 L 256,246 M 142,356 L 256,246 M 120,168 L 256,246" />
