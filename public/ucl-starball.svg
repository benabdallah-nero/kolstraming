    <!-- Star 4: Bottom Right -->
    <polygon points="351.88,288.39 380.39,328.93 428.71,317.88 398.96,357.52 424.40,400.05 377.51,384.01 344.91,421.35 345.68,371.79 300.10,352.34 347.46,337.75" fill="url(#starGlow)" />
    <!-- Star 5: Bottom -->
