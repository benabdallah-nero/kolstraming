<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="uclBg" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0a1d4a" />
      <stop offset="60%" stop-color="#020819" />
      <stop offset="100%" stop-color="#00040f" />
    </radialGradient>
    <linearGradient id="starGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f0f5ff" />
      <stop offset="100%" stop-color="#c5d8ff" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0055ff" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
