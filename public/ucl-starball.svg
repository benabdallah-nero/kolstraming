    <!-- Star 6: Bottom Left -->
    <polygon points="160.12,288.39 164.54,337.75 211.90,352.34 166.32,371.79 167.09,421.35 134.49,384.01 87.60,400.05 113.04,357.52 83.29,317.88 131.61,328.93" fill="url(#starGlow)" />
    <!-- Star 7: Top Left -->
    <polygon points="87.14,106.19 124.04,139.28 168.63,117.65 148.56,162.96 182.92,198.69 133.61,193.61 110.26,237.32 99.85,188.86 51.06,180.16 93.93,155.29" fill="url(#starGlow)" />
