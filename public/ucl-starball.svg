    <polygon points="303.02,181.28 287.38,235.80 332.08,270.72 275.40,272.70 256.00,326.00 236.60,272.70 179.92,270.72 224.62,235.80 208.98,181.28 256.00,213.00" fill="url(#starGlow)" />
